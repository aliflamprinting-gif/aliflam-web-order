<label class="field" for="checkoutProvince">PROVINSI *</label><input class="input" id="checkoutProvince" list="provinceOptions" placeholder="Ketik nama provinsi..." autocomplete="off"/><datalist id="provinceOptions"></datalist>
<label class="field" for="checkoutCity">KABUPATEN / KOTA *</label><input class="input" id="checkoutCity" list="cityOptions" placeholder="Pilih provinsi terlebih dahulu" autocomplete="off" disabled/><datalist id="cityOptions"></datalist>
<label class="field" for="checkoutDistrict">KECAMATAN *</label><input class="input" id="checkoutDistrict" list="districtOptions" placeholder="Pilih kabupaten/kota terlebih dahulu" autocomplete="off" disabled/><datalist id="districtOptions"></datalist>
<label class="field" for="checkoutVillage">DESA / KELURAHAN *</label><input class="input" id="checkoutVillage" list="villageOptions" placeholder="Pilih kecamatan terlebih dahulu" autocomplete="off" disabled/><datalist id="villageOptions"></datalist>
<label class="field" for="checkoutPostal">KODE POS</label><input class="input" id="checkoutPostal" inputmode="numeric" placeholder="Terisi otomatis" readonly/>
<label class="field" for="checkoutFullAddress">Alamat lengkap *</label><textarea class="input" id="checkoutFullAddress" placeholder="Nama jalan, nomor rumah, RT/RW, kelurahan" rows="3"></textarea>
<label class="field" for="checkoutReference">Patokan (opsional)</label><input class="input" id="checkoutReference" placeholder="Patokan lokasi"/>
